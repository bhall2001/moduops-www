packages:
  - moduops

# minutes; 7d cooldown on newly published versions
minimumReleaseAge: 10080
minimumReleaseAgeExclude: []

# pnpm 11 requires build scripts to be opted in
allowBuilds:
  aws-sdk: true
  core-js: true
  core-js-pure: true

# transitive via copy-webpack-plugin; RCE + DoS advisories
overrides:
  serialize-javascript: ">=7.1.3"
  # transitive via sockjs>webpack-dev-server; buf bounds check
  uuid: ">=11.1.1"
  # docusaurus transitives; pnpm audit 2026-11-13
  proxy-addr@<2.0.8: ">=2.0.8 <3"
  shell-quote@<1.11.0: ">=1.11.0 <2"
  tinypool@<2.1.2: ">=2.1.2 <3"
  body-parser@<1.20.9: ">=1.20.9 <2"
  brace-expansion@<1.1.21: ">=1.1.21 <2"
  compression@<1.8.2: ">=1.8.2 <2"
  fast-uri@<3.1.9: ">=3.1.9 <4"
  follow-redirects@<1.16.2: ">=1.16.2 <2"
  image-size@<2.0.3: ">=2.0.3 <3"
  joi@<17.13.9: ">=17.13.9 <18"
  js-yaml@>=4 <4.3.2: ">=4.3.2 <5"
  launch-editor@<2.14.2: ">=2.14.2 <3"
  source-map-js@<1.2.2: ">=1.2.2 <2"
  svgo@>=3 <3.3.5: ">=3.3.5 <4"
  postcss-selector-parser@<6.1.5: ">=6.1.5 <7"
  postcss-selector-parser@>=7 <7.1.6: ">=7.1.6 <8"
  qs@<6.16.1: ">=6.16.1 <7"
